name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解压项目压缩包
        run: |
          if [ -f secure-guard-project.zip ]; then
            unzip -q secure-guard-project.zip
          fi

      - name: 设置 Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 安装项目依赖
        run: |
          cd secure-guard
          npm install

      - name: 修复 expo-font 兼容性
        run: |
          cd secure-guard
          rm -rf node_modules/expo-font/android
          if [ -f node_modules/expo/android/build/generated/expo/src/main/java/expo/modules/ExpoModulesPackageList.java ]; then
            sed -i '/expo.modules.font.FontLoaderModule.class,/d' node_modules/expo/android/build/generated/expo/src/main/java/expo/modules/ExpoModulesPackageList.java
            sed -i '/expo.modules.font.FontUtilsModule.class,/d' node_modules/expo/android/build/generated/expo/src/main/java/expo/modules/ExpoModulesPackageList.java
          fi

      - name: 修复 Gradle 兼容性
        run: |
          cd secure-guard
          sed -i 's/ext.useExpoPublishing = {/ext.useExpoPublishing = {\n  \/\/ fix/' node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle

      - name: 调整构建配置
        run: |
          cd secure-guard/android
          sed -i 's/org.gradle.jvmargs=-Xmx2048m/org.gradle.jvmargs=-Xmx4096m/' gradle.properties
          sed -i 's/reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64/reactNativeArchitectures=arm64-v8a/' gradle.properties

      - name: 构建 APK
        run: |
          cd secure-guard/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: secure-guard-apk
          path: secure-guard/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
