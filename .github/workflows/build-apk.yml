name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解压项目
        run: |
          ls -la
          if [ -f *.zip ]; then
            unzip -q *.zip
            ls -la
          fi
      - name: 定位项目目录
        id: finddir
        run: |
          DIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" | head -1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "项目目录: $DIR"
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: 安装依赖
        run: |
          cd ${{ steps.finddir.outputs.dir }}
          npm install
      - name: 修复兼容性
        run: |
          cd ${{ steps.finddir.outputs.dir }}
          rm -rf node_modules/expo-font/android node_modules/react-native-reanimated/android
          sed -i 's/ext.useExpoPublishing = {/ext.useExpoPublishing = {\n  \/\/ fix/' node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
          sed -i 's/org.gradle.jvmargs=-Xmx2048m/org.gradle.jvmargs=-Xmx4096m/' android/gradle.properties
          sed -i 's/reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
      - name: 构建APK
        run: |
          cd ${{ steps.finddir.outputs.dir }}/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: secure-guard-apk
          path: ${{ steps.finddir.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
